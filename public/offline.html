<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Forge · Offline</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;background:#fbfaf8;color:#1a1612}
  .c{max-width:22rem;text-align:center;padding:1.5rem}
  .i{width:48px;height:48px;border-radius:12px;background:#f2581c;margin:0 auto 1rem}
  p{color:#6e655d;line-height:1.5}
  button{margin-top:.5rem;border:0;border-radius:10px;background:#f2581c;color:#fff;font-weight:600;padding:.7rem 1.2rem;font-size:1rem}
</style>
</head>
<body>
<div class="c">
  <div class="i" aria-hidden="true"></div>
  <h1>You're offline</h1>
  <p>Forge needs a connection to load live evidence and scores. Reconnect and try again.</p>
  <button onclick="location.reload()">Try again</button>
</div>
</body>
</html>
